name: Publish npm package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable v-prefixed release tag to publish
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'jslee124/forge'
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js and npm registry
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check source and documentation
        run: |
          pnpm check
          pnpm check:docs

      - name: Run tests and deterministic release evidence
        run: |
          pnpm test
          pnpm eval:deterministic

      - name: Build and install-test the npm artifact
        run: pnpm package:verify

      - name: Verify tag and package versions
        run: pnpm release:verify-tag "$RELEASE_TAG"

      - name: Select npm dist-tag
        id: npm-dist-tag
        run: |
          npm_dist_tag="$(node scripts/release-version.mjs "$RELEASE_TAG")"
          echo "tag=$npm_dist_tag" >> "$GITHUB_OUTPUT"

      - name: Publish with npm trusted publishing
        working-directory: dist/npm/forge
        run: npm publish --access public --tag "${{ steps.npm-dist-tag.outputs.tag }}"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_notes=".github/releases/${RELEASE_TAG}.md"
          release_args=(
            "$RELEASE_TAG"
            --repo "$GITHUB_REPOSITORY"
            --verify-tag
            --title "Forge $RELEASE_TAG"
            --notes-file "$release_notes"
          )
          if [[ "${{ steps.npm-dist-tag.outputs.tag }}" == "next" ]]; then
            release_args+=(--prerelease)
          else
            release_args+=(--latest)
          fi
          gh release create "${release_args[@]}"
